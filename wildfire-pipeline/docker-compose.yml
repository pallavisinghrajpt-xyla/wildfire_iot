# ============================================================
#  Wildfire detection pipeline
#  sensor-sim ─┐
#              ├─(MQTT, public HiveMQ)→ bridge → Kafka → Flink → InfluxDB → Grafana
#  ESP32 later ┘
# ============================================================

services:

  # ---------- Kafka (KRaft mode: no Zookeeper) ----------
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: wf-kafka
    ports:
      - "9092:9092"      # exposed for host-side debugging tools; containers use kafka:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Any base64-ish 22-char string works as a KRaft cluster id.
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15

  # ---------- Kafka UI (web dashboard) ----------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: wf-kafka-ui
    ports:
      - "8080:8080"      # http://localhost:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: wildfire
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  # ---------- Sensor simulator (stands in for the ESP32 nodes) ----------
  sensor-sim:
    build: ./sensor-sim
    container_name: wf-sensor-sim
    environment:
      MQTT_BROKER: ${MQTT_BROKER}
      MQTT_PORT: ${MQTT_PORT}
      TOPIC_PREFIX: ${TOPIC_PREFIX}
    restart: unless-stopped

  # ---------- Custom MQTT -> Kafka bridge ----------
  bridge:
    build: ./bridge
    container_name: wf-bridge
    environment:
      MQTT_BROKER: ${MQTT_BROKER}
      MQTT_PORT: ${MQTT_PORT}
      TOPIC_PREFIX: ${TOPIC_PREFIX}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      KAFKA_RAW_TOPIC: ${KAFKA_RAW_TOPIC}
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ---------- InfluxDB v2 (time-series storage) ----------
  influxdb:
    image: influxdb:2.7
    container_name: wf-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influx-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15

  # ---------- Flink JobManager ----------
  flink-jobmanager:
    build: ./flink
    container_name: wf-flink-jobmanager
    ports:
      - "8081:8081"      # Flink web UI: http://localhost:8081
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
    depends_on:
      kafka:
        condition: service_healthy
      influxdb:
        condition: service_healthy

  # ---------- Flink TaskManager (runs the Python operators + InfluxDB writes) ----------
  flink-taskmanager:
    build: ./flink
    container_name: wf-flink-taskmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
    depends_on:
      - flink-jobmanager

  # ---------- One-shot job submitter (builds the graph, submits, exits) ----------
  flink-job-submitter:
    build: ./flink
    container_name: wf-flink-job-submitter
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      KAFKA_RAW_TOPIC: ${KAFKA_RAW_TOPIC}
      INFLUX_URL: ${INFLUX_URL}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      TEMP_THRESHOLD: ${TEMP_THRESHOLD}
      SMOKE_THRESHOLD: ${SMOKE_THRESHOLD}
      WINDOW_SECONDS: ${WINDOW_SECONDS}
      MIN_BREACHES: ${MIN_BREACHES}
    command: >
      bash -c "
        echo '[submitter] waiting for JobManager REST...' &&
        until curl -sf http://flink-jobmanager:8081/overview >/dev/null; do sleep 3; done &&
        echo '[submitter] submitting PyFlink job...' &&
        flink run -m flink-jobmanager:8081 -py /opt/flink/usrlib/wildfire_job.py -d &&
        echo '[submitter] job submitted.'
      "
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    restart: on-failure

  # ---------- Grafana (dashboards + alert view) ----------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: wf-grafana
    ports:
      - "3000:3000"      # http://localhost:3000  (admin/admin by default)
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      # exposed so the provisioned datasource file can read them
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      influxdb:
        condition: service_healthy

volumes:
  kafka-data:
  influx-data:
  grafana-data:
